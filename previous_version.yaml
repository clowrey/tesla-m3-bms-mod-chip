  # Synchronized display update - triggers on data arrival or timeout
  - interval: 100ms
    then:
      - lambda: |-
          // Check if we should update display
          unsigned long now = millis();
          bool data_timeout = (now - id(last_data_received)) > 2000;  // 2 second timeout
          bool data_ready = id(display_needs_update);
          
          // Only update if we have new data or timeout occurred
          if (!data_ready && !data_timeout) {
            return;  // Skip update this cycle
          }
          
          // Reset the update flag
          id(display_needs_update) = false;
          
          if (data_timeout) {
            ESP_LOGW("BMS", "Display update triggered by timeout (no data for >2s)");
          } else {
            ESP_LOGD("BMS", "Display update triggered by new data");
          }
          // Update display labels with current sensor values
          char buffer[64];
          
          // Update cells info - show BMB count and balance status combined
          if (id(numbmbs).has_state()) {
            snprintf(buffer, sizeof(buffer), "BMBs: %d | Balance: %s", 
                     (int)id(numbmbs).state, 
                     (id(balance).has_state() && id(balance).state > 0.5) ? "ON" : "OFF");
          } else {
            snprintf(buffer, sizeof(buffer), "BMBs: -- | Balance: --");
          }
          lv_label_set_text((lv_obj_t*)id(label_cells), buffer);
          
          // Set color based on balance status
          if (id(balance).has_state() && id(balance).state > 0.5) {
            lv_obj_set_style_text_color((lv_obj_t*)id(label_cells), lv_color_make(0, 255, 0), LV_PART_MAIN); // Green when balancing
          } else {
            lv_obj_set_style_text_color((lv_obj_t*)id(label_cells), lv_color_make(255, 255, 255), LV_PART_MAIN); // White when not balancing
          }
          
          // Update voltage info - check for valid data
          if (id(umax).has_state() && id(cellmax).has_state()) {
            snprintf(buffer, sizeof(buffer), "Max: %.3fV (Cell %d)", 
                     id(umax).state, (int)id(cellmax).state);
          } else {
            snprintf(buffer, sizeof(buffer), "Max: --.---V (Cell --)");
          }
          lv_label_set_text((lv_obj_t*)id(label_max_voltage), buffer);
          
          if (id(umin).has_state() && id(cellmin).has_state()) {
            snprintf(buffer, sizeof(buffer), "Min: %.3fV (Cell %d)", 
                     id(umin).state, (int)id(cellmin).state);
          } else {
            snprintf(buffer, sizeof(buffer), "Min: --.---V (Cell --)");
          }
          lv_label_set_text((lv_obj_t*)id(label_min_voltage), buffer);
          
          if (id(deltav).has_state()) {
            snprintf(buffer, sizeof(buffer), "Delta: %.3fV", 
                     id(deltav).state);
          } else {
            snprintf(buffer, sizeof(buffer), "Delta: --.---V");
          }
          lv_label_set_text((lv_obj_t*)id(label_delta), buffer);
          

          
          // Use cell sum voltage from BMS (via serial API)
          float cell_sum = 0.0f;
          if (id(cell_sum_voltage).has_state() && id(cell_sum_voltage).state > 0.1f) {
            cell_sum = id(cell_sum_voltage).state;
          }
          
          // Update average voltage display on main page - use uavg parameter from BMS
          if (id(uavg).has_state() && id(uavg).state > 0.01f) {
            snprintf(buffer, sizeof(buffer), "Cell Avg: %.3fV", id(uavg).state);
          } else {
            snprintf(buffer, sizeof(buffer), "Cell Avg: --.---V");
