# Interval to process incoming UART data (simplified - no more requests!)
interval:
  # Fast interval to read and parse incoming UART data
  - interval: 100ms
    then:
      - lambda: |-
          // Read available UART data
          std::string &buffer = id(uart_buffer);
          uint8_t data;
          while (id(tesla_bms_uart_uart).available()) {
            id(tesla_bms_uart_uart).read_byte(&data);
            char c = (char)data;
            if (c == '\n' || c == '\r') {
              if (!buffer.empty()) {
                ESP_LOGI("BMS", "RECEIVED: [%s] (length: %d)", buffer.c_str(), buffer.length());
                
                // Skip the end marker and comments
                if (buffer == "DATA_COMPLETE" || buffer.find("#") != std::string::npos) {
                  if (buffer == "DATA_COMPLETE") {
                    // Mark that we received a complete data packet
                    id(last_data_received) = millis();
                    id(display_needs_update) = true;
                    ESP_LOGI("BMS", "DATA_COMPLETE received - triggering display update");
                  }
                  ESP_LOGV("BMS", "Skipping marker/comment line: %s", buffer.c_str());
                } else {
                  // Parse the line in format "param=value"
                  size_t pos = buffer.find("=");
                  if (pos != std::string::npos) {
                    std::string param = buffer.substr(0, pos);
                    std::string value_str = buffer.substr(pos + 1);
                    
                    // Trim whitespace
                    param.erase(0, param.find_first_not_of(" \t\r\n"));
                    param.erase(param.find_last_not_of(" \t\r\n") + 1);
                    value_str.erase(0, value_str.find_first_not_of(" \t\r\n"));
                    value_str.erase(value_str.find_last_not_of(" \t\r\n") + 1);
                    
                    // Skip if parameter name is empty
                    if (!param.empty()) {
                      ESP_LOGI("BMS", "DEBUG: PARSING: param='%s' value_str='%s'", param.c_str(), value_str.c_str());
                      
                      // Validate that value_str is not empty and looks like a number for numeric params
                      if (!value_str.empty() && (isdigit(value_str[0]) || value_str[0] == '.' || value_str[0] == '-')) {
                        float value = atof(value_str.c_str());
                        ESP_LOGI("BMS", "DEBUG: PARSED VALUE: %s = %f", param.c_str(), value);
                        
                        // Update corresponding sensors - All parameter names match BMS exactly
                        bool sensor_updated = false;
                        if (param == "numbmbs") { 
                          ESP_LOGI("BMS", "DEBUG: UPDATING numbmbs = %f", value);
                          id(numbmbs).publish_state(value); 
                          sensor_updated = true; 
                        }
                        else if (param == "LoopCnt") { 
                          ESP_LOGI("BMS", "DEBUG: UPDATING LoopCnt = %f", value);
                          id(loopcnt).publish_state(value); 
                          sensor_updated = true; 
                        }
                        else if (param == "LoopState") { 
                          ESP_LOGI("BMS", "DEBUG: UPDATING LoopState = %f", value);
                          id(loopstate).publish_state(value); 
                          sensor_updated = true; 
                        }
                        else if (param == "CellsPresent") { id(cellspresent).publish_state(value); sensor_updated = true; }
                        else if (param == "CellsBalancing") { id(cellsbalancing).publish_state(value); sensor_updated = true; }
                        else if (param == "CellMax") { id(cellmax).publish_state(value); sensor_updated = true; }
                        else if (param == "CellMin") { id(cellmin).publish_state(value); sensor_updated = true; }
                        else if (param == "umax") { 
                          // Check for 5V initialization value (5000mV) and skip
                          if (value == 5000.0) {
                            ESP_LOGI("BMS", "Detected 5V initialization value for %s, skipping", param.c_str());
                          } else {
                            id(umax).publish_state(value / 1000.0); 
                          }
                          sensor_updated = true; 
                        }
                        else if (param == "umin") { 
                          // Check for 5V initialization value (5000mV) and skip
                          if (value == 5000.0) {
                            ESP_LOGI("BMS", "Detected 5V initialization value for %s, skipping", param.c_str());
                          } else {
                            id(umin).publish_state(value / 1000.0); 
                          }
                          sensor_updated = true; 
                        }
                        else if (param == "deltaV") { id(deltav).publish_state(value / 1000.0); sensor_updated = true; }
                        else if (param == "uavg") { 
                          ESP_LOGI("BMS", "DEBUG: UPDATING uavg = %f mV -> %f V", value, value / 1000.0);
                          id(uavg).publish_state(value / 1000.0); 
                          sensor_updated = true; 
                        }
                        else if (param == "udc") { id(udc).publish_state(value); sensor_updated = true; }
                        else if (param == "CellVoltageSum") { 
                          ESP_LOGI("BMS", "DEBUG: UPDATING CellVoltageSum = %f mV -> %f V", value, value / 1000.0);
                          id(cell_sum_voltage).publish_state(value / 1000.0); 
                          sensor_updated = true; 
                        }
                        else if (param == "Chipt0") { id(chipt0).publish_state(value); sensor_updated = true; }
                        else if (param == "Cellt0_0") { id(cellt0_0).publish_state(value); sensor_updated = true; }
                        else if (param == "Cellt0_1") { id(cellt0_1).publish_state(value); sensor_updated = true; }
                        else if (param == "TempMax") { id(tempmax).publish_state(value); sensor_updated = true; }
                        else if (param == "TempMin") { id(tempmin).publish_state(value); sensor_updated = true; }
                        else if (param == "balance") { 
                          id(balance).publish_state(value); 
                          // Clear balance cell list when balancing is turned off
                          if (value < 0.5) {
                            id(balance_cell_list).publish_state("");
                            ESP_LOGI("BMS", "Balancing OFF - clearing balance cell list");
                          }
                          sensor_updated = true; 
                        }
                        else if (param == "ChipV1") { id(chipv1).publish_state(value); sensor_updated = true; }
                        else if (param == "ChipV2") { id(chipv2).publish_state(value); sensor_updated = true; }
                        else if (param == "ChipV3") { id(chipv3).publish_state(value); sensor_updated = true; }
                        else if (param == "ChipV4") { id(chipv4).publish_state(value); sensor_updated = true; }
                        else if (param == "current") { 
                          ESP_LOGI("BMS", "DEBUG: UPDATING current = %f A", value);
                          id(bms_current).publish_state(value); 
                          sensor_updated = true; 
                        }
                        else if (param == "as8510_temp") { 
                          ESP_LOGI("BMS", "DEBUG: UPDATING as8510_temp = %f °C", value);
                          id(as8510_temp).publish_state(value); 
                          sensor_updated = true; 
                        }
                        else if (param == "battPos") { 
                          ESP_LOGI("BMS", "DEBUG: UPDATING battPos = %f V", value);
                          id(batt_pos).publish_state(value); 
                          sensor_updated = true; 
                        }
                        else if (param == "battNeg") { 
                          ESP_LOGI("BMS", "DEBUG: UPDATING battNeg = %f V", value);
                          id(batt_neg).publish_state(value); 
                          sensor_updated = true; 
                        }
                        else if (param == "linkPos") { 
                          ESP_LOGI("BMS", "DEBUG: UPDATING linkPos = %f V", value);
                          id(link_pos).publish_state(value); 
                          sensor_updated = true; 
                        }
                        else if (param == "linkNeg") { 
                          ESP_LOGI("BMS", "DEBUG: UPDATING linkNeg = %f V", value);
                          id(link_neg).publish_state(value); 
                          sensor_updated = true; 
                        }
                        else if (param == "packContactors") { 
                          ESP_LOGI("BMS", "DEBUG: UPDATING packContactors = %f", value);
                          id(pack_contactors_status).publish_state(value); 
                          sensor_updated = true; 
                        }
                        else if (param == "cpContactors") { 
                          ESP_LOGI("BMS", "DEBUG: UPDATING cpContactors = %f", value);
                          id(cp_contactors_status).publish_state(value); 
                          sensor_updated = true; 
                        }
                        else if (param == "PowerWatts") { 
                          ESP_LOGI("BMS", "DEBUG: UPDATING PowerWatts = %f", value);
                          id(bms_power).publish_state(value); 
                          sensor_updated = true; 
                        }
                        else if (param == "EnergyWh") { 
                          ESP_LOGI("BMS", "DEBUG: UPDATING EnergyWh = %f", value);
                          id(bms_energy_wh).publish_state(value); 
                          sensor_updated = true; 
                        }
                        else if (param == "EnergyKWh") { 
                          ESP_LOGI("BMS", "DEBUG: UPDATING EnergyKWh = %f", value);
                          id(bms_energy_kwh).publish_state(value); 
                          sensor_updated = true; 
                        }
                        else if (param == "StateOfCharge") { 
                          ESP_LOGI("BMS", "DEBUG: UPDATING StateOfCharge = %f", value);
                          id(bms_soc).publish_state(value); 
                          sensor_updated = true; 
                        }
                        else if (param == "RemainingCapacityAh") { 
                          ESP_LOGI("BMS", "DEBUG: UPDATING RemainingCapacityAh = %f", value);
                          id(bms_remaining_capacity).publish_state(value); 
                          sensor_updated = true; 
                        }
                        else if (param == "BatteryCapacityAh") { 
                          ESP_LOGI("BMS", "DEBUG: UPDATING BatteryCapacityAh = %f", value);
                          id(bms_battery_capacity).publish_state(value); 
                          sensor_updated = true; 
                        }
                        else if (param == "FullyChargedVoltage") { 
                          ESP_LOGI("BMS", "DEBUG: UPDATING FullyChargedVoltage = %f", value);
                          id(bms_fully_charged_voltage).publish_state(value); 
                          sensor_updated = true; 
                        }
                        else if (param == "CurrentEfficiency") { 
                          ESP_LOGI("BMS", "DEBUG: UPDATING CurrentEfficiency = %f", value);
                          id(bms_current_efficiency).publish_state(value * 100.0); // Convert to percentage
                          sensor_updated = true; 
                        }
                        
                        // Individual cell voltages - Handle both old format (u1-u108) and new numeric format (1-108)
                        else if ((param.substr(0,1) == "u" && param.length() >= 2) || 
                                 (isdigit(param[0]) && param.length() >= 1 && param.length() <= 3)) {
                          ESP_LOGI("BMS", "DEBUG: Processing cell voltage %s = %f", param.c_str(), value);
                          
                          // Convert numeric cell ID to corresponding sensor ID
                          int cell_num = 0;
                          if (param.substr(0,1) == "u") {
                            // Old format: u1, u2, etc. - extract number after 'u'
                            cell_num = atoi(param.substr(1).c_str());
                          } else {
                            // New format: 1, 2, etc. - direct numeric ID
                            cell_num = atoi(param.c_str());
                          }
                          
                          // Skip 5V initialization values (5000mV) and values below 10mV
                          if (value == 5000.0) {
                            ESP_LOGV("BMS", "Skipping 5V initialization value for cell %d", cell_num);
                            sensor_updated = true;
                          } else if (value < 10.0) {
                            ESP_LOGV("BMS", "Skipping low voltage value (%.1fmV) for cell %d", value, cell_num);
                            sensor_updated = true;
                          } else {
                            // Publish the voltage value converted from mV to V
                            float voltage_v = value / 1000.0;
                            
                            // Update individual cell sensors (cells 1-108)
                            if (cell_num == 1) { id(u001).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 2) { id(u002).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 3) { id(u003).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 4) { id(u004).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 5) { id(u005).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 6) { id(u006).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 7) { id(u007).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 8) { id(u008).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 9) { id(u009).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 10) { id(u010).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 11) { id(u011).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 12) { id(u012).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 13) { id(u013).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 14) { id(u014).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 15) { id(u015).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 16) { id(u016).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 17) { id(u017).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 18) { id(u018).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 19) { id(u019).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 20) { id(u020).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 21) { id(u021).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 22) { id(u022).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 23) { id(u023).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 24) { id(u024).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 25) { id(u025).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 26) { id(u026).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 27) { id(u027).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 28) { id(u028).publish_state(voltage_v); sensor_updated = true; }
                            else if (cell_num == 29) { id(u029).publish_state(voltage_v); sensor_updated = true; }
