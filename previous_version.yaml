esphome:
  name: tesla-bms-display
  friendly_name: Tesla BMS Display
  min_version: 2024.11.0
  on_boot:
    priority: 800.0
    then:
      - lambda: |-
          // Test display with a simple message
          lv_label_set_text((lv_obj_t*)id(label_title), "System Overview");
          lv_label_set_text((lv_obj_t*)id(label_cells), "Backlight: ON");
          lv_label_set_text((lv_obj_t*)id(label_connected), "Status: OK");
          ESP_LOGI("DISPLAY", "Display labels updated");

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

preferences:
  flash_write_interval: 1min



# Include individual cell voltage sensors
packages:
  cell_voltages: !include cell_voltage_sensors.yaml

psram:
  mode: octal
  speed: 80MHz

# Enable logging
logger:
  level: ERROR
  hardware_uart: USB_SERIAL_JTAG

# WiFi configuration
wifi:
  #use_address: 10.60.5.130
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: "Tesla_BMS_Display_AP"
    password: "12345678"

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

# Enable OTA updates
ota:
  platform: esphome
  password: !secret ota_password

# Enable web server
web_server:
  port: 80
  version: 3

# Time component for timestamps
time:
  - platform: sntp
    id: sntp_time

# UART for communication with Tesla BMS
uart:
  id: tesla_bms_uart_uart
  tx_pin: GPIO43
  rx_pin: GPIO44
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1

# Global variables to store UART buffer
globals:
  - id: uart_buffer
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: cell_bars_created
    type: bool
    restore_value: no
    initial_value: 'false'
  # Display update synchronization
  - id: last_data_received
    type: unsigned long
    restore_value: no
    initial_value: '0'
  - id: display_needs_update
    type: bool
    restore_value: no
    initial_value: 'false'
  # Alternative: Parameter request queue for more sophisticated control
  # - id: param_request_queue
  #   type: std::vector<std::string>
  #   restore_value: no
  # - id: current_param_index
  #   type: int
  #   restore_value: no
  #   initial_value: '0'

# Display backlight control
output:
  - platform: ledc 
    pin: GPIO1
    id: backlight
    frequency: "1000Hz"

light:
  - platform: monochromatic
    output: backlight
    name: Display Backlight
    id: display_backlight
    restore_mode: ALWAYS_ON

i2c:
  sda: 4
  scl: 8
  id: touchscreen_bus

touchscreen:
  - platform: axs15231
    id: my_touchscreen
    display: my_display
    i2c_id: touchscreen_bus
    calibration:
      x_min: 0
      x_max: 480
      y_min: 0
      y_max: 320
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: false
    on_touch:
      - lambda: |-
          ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
            touch.x,
            touch.y,
            touch.x_raw,
            touch.y_raw
          );

# QSPI Display (matching ESPHome EVSE configuration)
spi:
  id: display_qspi
  type: quad
  clk_pin: 47
  data_pins: [21, 48, 40, 39]

display:
  - platform: qspi_dbi
    model: JC4832W535
    data_rate: 40MHz
    id: my_display
    spi_id: display_qspi
    dimensions:
      height: 480
      width: 320
    cs_pin:
      number: 45
      ignore_strapping_warning: true
    rotation: 270
    auto_clear_enabled: false

# LVGL interface
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  page_wrap: true
  theme:
    obj:
      border_width: 0
      pad_all: 0
      bg_color: 0
      text_color: white
      scrollable: false
    label:
      border_width: 0
      scrollable: false
    button:
      text_font: montserrat_14
      scroll_on_focus: true
      radius: 10px
      shadow_width: 0
      checked:
        bg_color: green
        text_color: white

# Main Page
  pages:
    - id: main_page
      height: 320
      width: 480
      text_font: montserrat_14
      scrollable: false
      text_color: white
      bg_color: 0
      bg_opa: COVER
      radius: 0
      pad_all: 2
      widgets:
        - obj:
            align: LEFT_MID
            width: 480
            height: 320
            pad_all: 2
            layout:
              pad_column: 2
              type: GRID
