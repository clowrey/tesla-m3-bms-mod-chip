                    // For normal voltages (2.6-4.2V), map to bar height correctly
                    // 2.6V = 0px height (at bottom), 4.2V = 240px height (full height)
                    base_height = (int)((voltage - 2.6f) / 1.6f * 240.0f);
                  }
                  
