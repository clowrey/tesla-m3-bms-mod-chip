                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  id: label_time
                  align: RIGHT_MID
                  text: "00:00:00"
                  text_color: white
                  text_font: montserrat_12
              - label:
                  grid_cell_column_pos: 0
                  grid_cell_row_pos: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  id: label_cells
                  align: LEFT_MID
                  text: "BMBs: 0 | Balance: OFF"
                  text_color: white
                  text_font: montserrat_12
              - label:
