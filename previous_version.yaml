                    } else {
                      lv_obj_set_style_bg_color(bar, lv_color_make(0, 100, 255), LV_PART_MAIN);
                    }
                  }
                }
              }
            }
            
            ESP_LOGI("DISPLAY", "Updated all 108 cell voltage bars (real BMS data)");
