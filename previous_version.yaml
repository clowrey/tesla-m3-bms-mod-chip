              grid_columns: [FR(240), FR(240)]
            widgets:
              - label:
                  grid_cell_column_pos: 0
                  grid_cell_row_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  id: label_title
                  align: LEFT_MID
                  text: "M3Y BMS MOD Interface"
                  text_color: white
              - label:
