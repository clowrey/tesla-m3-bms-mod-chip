    accuracy_decimals: 2
  - <<: *voltage_sensor_template
    name: "Chip 4 Voltage"
    id: chipv4
    accuracy_decimals: 2

  # ADS1115 Pack Voltage sensors
  - <<: *voltage_sensor_template
    name: "Batt Contactor V+"
    id: batt_pos
  - <<: *voltage_sensor_template
    name: "Batt Contactor V-"
    id: batt_neg
