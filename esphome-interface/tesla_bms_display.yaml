    name: "Tesla BMS Display Status"
    id: display_status

# Simplified switch definitions using consistent patterns
switch:
  - platform: template
    name: "Pack Contactors"
    id: pack_contactors_switch
    optimistic: true
    restore_mode: DISABLED
    turn_on_action:
      - uart.write:
          id: tesla_bms_uart_uart
          data: "pack contactors on\n"
      - lambda: |-
          lv_obj_set_style_bg_color((lv_obj_t*)id(btn_pack_contactors), lv_color_make(0, 255, 0), LV_PART_MAIN);
    turn_off_action:
      - uart.write:
          id: tesla_bms_uart_uart
          data: "pack contactors off\n"
      - lambda: |-
          lv_obj_set_style_bg_color((lv_obj_t*)id(btn_pack_contactors), lv_color_make(128, 128, 128), LV_PART_MAIN);

  - platform: template
    name: "Charge Port Contactors"
    id: cp_contactors_switch
    optimistic: true
    restore_mode: DISABLED
    turn_on_action:
      - uart.write:
          id: tesla_bms_uart_uart
          data: "cp contactors on\n"
      - lambda: |-
          lv_obj_set_style_bg_color((lv_obj_t*)id(btn_cp_contactors), lv_color_make(0, 255, 0), LV_PART_MAIN);
    turn_off_action:
      - uart.write:
          id: tesla_bms_uart_uart
          data: "cp contactors off\n"
      - lambda: |-
          lv_obj_set_style_bg_color((lv_obj_t*)id(btn_cp_contactors), lv_color_make(128, 128, 128), LV_PART_MAIN);

  - platform: template
    name: "Cell Balancing"
    id: balancing_switch
    optimistic: true
    restore_mode: DISABLED
    turn_on_action:
      - uart.write:
          id: tesla_bms_uart_uart
          data: "balance on\n"
      - lambda: |-
          lv_obj_set_style_bg_color((lv_obj_t*)id(btn_balance_on), lv_color_make(0, 255, 0), LV_PART_MAIN);
          lv_obj_set_style_bg_color((lv_obj_t*)id(btn_balance_off), lv_color_make(128, 128, 128), LV_PART_MAIN);
    turn_off_action:
      - uart.write:
          id: tesla_bms_uart_uart
          data: "balance off\n"
      - lambda: |-
          lv_obj_set_style_bg_color((lv_obj_t*)id(btn_balance_on), lv_color_make(128, 128, 128), LV_PART_MAIN);
          lv_obj_set_style_bg_color((lv_obj_t*)id(btn_balance_off), lv_color_make(255, 0, 0), LV_PART_MAIN);

# Drastically simplified sensor definitions using YAML anchors
sensor:
  # System parameters (first sensor serves as template anchor)
  - &sensor_template
    platform: template
    accuracy_decimals: 0
    name: "Batman ICs Detected"
    id: numbmbs
    unit_of_measurement: "boards"
  - <<: *sensor_template
    name: "BMB Actual Count"
    id: actual_bmb_count
    unit_of_measurement: "boards"
  - <<: *sensor_template
    name: "BMB Expected Count"
    id: expected_bmb_count
    unit_of_measurement: "boards"
  - <<: *sensor_template
    name: "BMB Connected Mask"
    id: bmb_connected_mask
    unit_of_measurement: "mask"
  - <<: *sensor_template
    name: "Batman Loop Counter"
    id: loopcnt
    unit_of_measurement: "count"
  - <<: *sensor_template
    name: "Batman Loop State"
    id: loopstate
    unit_of_measurement: "state"
  - <<: *sensor_template
    name: "Cells Present"
    id: cellspresent
    unit_of_measurement: "cells"
  - <<: *sensor_template
    name: "Cells Balancing"
    id: cellsbalancing
    unit_of_measurement: "cells"

  # Voltage statistics
  - <<: *sensor_template
    name: "Cell Number Max"
    id: cellmax
    unit_of_measurement: "cell"
  - <<: *sensor_template
