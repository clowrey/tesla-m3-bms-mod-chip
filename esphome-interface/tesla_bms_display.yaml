    name: "Batt Link V+"
    id: link_pos
  - <<: *voltage_sensor_template
    name: "Batt Link V-"
    id: link_neg

  # Temperature sensors
  - &temp_sensor_template
    platform: template
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    name: "Chip Temperature"
    id: chipt0
