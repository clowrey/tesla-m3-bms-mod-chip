  - <<: *energy_sensor_template
    name: "BMS Remaining Capacity"
    id: bms_remaining_capacity
    unit_of_measurement: "Ah"
  - <<: *energy_sensor_template
    name: "BMS Battery Capacity"
    id: bms_battery_capacity
    unit_of_measurement: "Ah"
  - <<: *voltage_sensor_template
    name: "BMS Fully Charged Voltage"
    id: bms_fully_charged_voltage
    accuracy_decimals: 2
  - <<: *energy_sensor_template
    name: "BMS Current Efficiency"
    id: bms_current_efficiency
    unit_of_measurement: "%"

text_sensor:
  - platform: template
