esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

preferences:
  flash_write_interval: 1min

packages:
  cell_voltages: !include cell_voltage_sensors.yaml

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: "Tesla_BMS_Display_AP"
    password: "12345678"

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  platform: esphome
  password: !secret ota_password

#web_server:
#  port: 80
#  version: 3

time:
  - platform: sntp
    id: sntp_time

uart:
  id: tesla_bms_uart_uart
  tx_pin: GPIO43
  rx_pin: GPIO44
  baud_rate: 921600
  data_bits: 8
  parity: NONE
  stop_bits: 1

external_components:
  - source:
      type: local
      path: external_components

tesla_bms_uart:
  uart_id: tesla_bms_uart_uart
  id: tesla_bms_component

globals:
  - id: cell_bars_created
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: last_data_received
    type: unsigned long
    restore_value: no
    initial_value: '0'
  - id: display_needs_update
    type: bool
    restore_value: no
    initial_value: 'false'

output:
  - platform: ledc 
    pin: GPIO1
    id: backlight
    frequency: "1000Hz"

light:
  - platform: monochromatic
    output: backlight
    name: Display Backlight
    id: display_backlight
    restore_mode: ALWAYS_ON

i2c:
  sda: 4
  scl: 8
  id: touchscreen_bus

touchscreen:
  - platform: axs15231
    id: my_touchscreen
    display: my_display
    i2c_id: touchscreen_bus
    calibration:
      x_min: 0
      x_max: 480
      y_min: 0
      y_max: 320
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: false
    on_touch:
      - lambda: |-
          ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d", touch.x, touch.y, touch.x_raw, touch.y_raw);

spi:
  id: display_qspi
  type: quad
  clk_pin: 47
  data_pins: [21, 48, 40, 39]

display:
  - platform: qspi_dbi
    model: JC4832W535
    data_rate: 40MHz
    id: my_display
    spi_id: display_qspi
    dimensions:
      height: 480
      width: 320
    cs_pin:
      number: 45
      ignore_strapping_warning: true
    rotation: 270
    auto_clear_enabled: false

# Template anchors moved inside sensor section to avoid ESPHome component conflicts

# Concise LVGL interface with reduced repetition
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  page_wrap: true
  theme:
    obj:
      border_width: 0
      pad_all: 0
      bg_color: 0
      text_color: white
      scrollable: false
    label:
      border_width: 0
      scrollable: false
    button:
      text_font: montserrat_14
      scroll_on_focus: true
      radius: 10px
      shadow_width: 0
      checked:
        bg_color: green
        text_color: white

  pages:
    - id: main_page
      height: 320
      width: 480
      text_font: montserrat_14
      scrollable: false
      text_color: white
      bg_color: 0
      bg_opa: COVER
      radius: 0
      pad_all: 2
      widgets:
        - obj:
            align: LEFT_MID
            width: 480
            height: 320
            pad_all: 2
            layout:
              pad_column: 2
              type: GRID
              grid_rows: [FR(35), FR(25), FR(25), FR(25), FR(25), FR(25), FR(25), FR(40), FR(40), FR(40)]
              grid_columns: [FR(240), FR(240)]
            widgets:
              - label:
                  grid_cell_column_pos: 0
                  grid_cell_row_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  id: label_title
                  align: LEFT_MID
                  text: "M3Y BMS MOD Interface"
                  text_color: white
              - label:
                  grid_cell_column_pos: 1
                  grid_cell_row_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  id: label_time
                  align: RIGHT_MID
                  text: "00:00:00"
                  text_color: white
                  text_font: montserrat_12
              - label:
                  grid_cell_column_pos: 0
                  grid_cell_row_pos: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  id: label_cells
                  align: LEFT_MID
                  text: "BMBs: 0 | Balance: OFF"
                  text_color: white
                  text_font: montserrat_12
              - label:
                  grid_cell_column_pos: 1
                  grid_cell_row_pos: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  id: label_connected
                  align: RIGHT_MID
                  text: "Connected: No"
                  text_color: red
                  text_font: montserrat_12
              - label:
                  grid_cell_column_pos: 0
                  grid_cell_row_pos: 2
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  id: label_max_voltage
                  align: LEFT_MID
                  text: "Max: 0.000V (Cell 0)"
                  text_color: white
                  text_font: montserrat_12
              - label:
                  grid_cell_column_pos: 1
                  grid_cell_row_pos: 2
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  id: label_min_voltage
                  align: RIGHT_MID
                  text: "Min: 0.000V (Cell 0)"
                  text_color: white
                  text_font: montserrat_12
              - label:
                  grid_cell_column_pos: 0
                  grid_cell_row_pos: 3
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  id: label_delta
                  align: LEFT_MID
                  text: "Delta: 0.000V"
                  text_color: white
                  text_font: montserrat_12
              - label:
                  grid_cell_column_pos: 1
                  grid_cell_row_pos: 3
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  id: label_avg_display
                  align: RIGHT_MID
                  text: "Cell Avg: 0.000V"
                  text_color: white
                  text_font: montserrat_12
              - label:
                  grid_cell_column_pos: 0
                  grid_cell_row_pos: 4
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  id: label_pack_voltage
                  align: LEFT_MID
                  text: "Pack: 0.00V"
                  text_color: white
                  text_font: montserrat_12
              - label:
                  grid_cell_column_pos: 1
                  grid_cell_row_pos: 4
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  id: label_current
                  align: RIGHT_MID
                  text: "Current: 0.00A"
                  text_color: white
                  text_font: montserrat_12
              - label:
                  grid_cell_column_pos: 0
                  grid_cell_row_pos: 5
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  id: label_power
                  align: LEFT_MID
                  text: "Power: 0.0W"
                  text_color: white
                  text_font: montserrat_12
              - label:
                  grid_cell_column_pos: 1
                  grid_cell_row_pos: 5
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  id: label_energy_kwh
                  align: RIGHT_MID
                  text: "Energy: 0.000kWh"
                  text_color: white
                  text_font: montserrat_12
              - button:
                  grid_cell_column_pos: 0
                  grid_cell_row_pos: 7
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  id: btn_pack_contactors
                  bg_color: grey
                  widgets:
                    - label:
                        align: CENTER
                        text: "Pack Contactors"
                        text_color: white
                  on_short_click:
                    - lambda: |-
                        if (id(pack_contactors_switch).state) {
                          id(pack_contactors_switch).turn_off();
                        } else {
                          id(pack_contactors_switch).turn_on();
                        }
              - button:
                  grid_cell_column_pos: 1
                  grid_cell_row_pos: 7
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  id: btn_cp_contactors
                  bg_color: grey
                  widgets:
                    - label:
                        align: CENTER
                        text: "CP Contactors"
                        text_color: white
                  on_short_click:
                    - lambda: |-
                        if (id(cp_contactors_switch).state) {
                          id(cp_contactors_switch).turn_off();
                        } else {
                          id(cp_contactors_switch).turn_on();
                        }
              - label:
                  grid_cell_column_pos: 1
                  grid_cell_row_pos: 6
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  id: label_soc
                  align: RIGHT_MID
                  text: "SOC: --.-%"
                  text_color: white
                  text_font: montserrat_12
              - label:
                  grid_cell_column_pos: 0
                  grid_cell_row_pos: 6
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  id: label_loop
                  align: LEFT_MID
                  text: "Loop: 0 (State: 0)"
                  text_color: white
                  text_font: montserrat_12
              - button:
                  grid_cell_column_pos: 0
                  grid_cell_row_pos: 8
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  id: btn_balance_on
                  bg_color: grey
                  widgets:
                    - label:
                        align: CENTER
                        text: "Balance ON"
                        text_color: white
                  on_short_click:
                    - lambda: |-
                        id(balancing_switch).turn_on();
              - button:
                  grid_cell_column_pos: 1
                  grid_cell_row_pos: 8
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  id: btn_balance_off
                  bg_color: grey
                  widgets:
