    name: "Cell Temperature Max"
    id: tempmax
  - <<: *temp_sensor_template
    name: "Cell Temperature Min"
    id: tempmin

  # Balance control
  - <<: *sensor_template
    name: "Cell Balance Status"
    id: balance
