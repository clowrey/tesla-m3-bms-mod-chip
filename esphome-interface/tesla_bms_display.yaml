esphome:
  name: tesla-bms-display
  friendly_name: Tesla BMS Display
  min_version: 2024.11.0
  on_boot:
    - priority: 800.0
      then:
        - lambda: |-
            lv_label_set_text((lv_obj_t*)id(label_title), "System Overview");
            lv_label_set_text((lv_obj_t*)id(label_cells), "Backlight: ON");
            lv_label_set_text((lv_obj_t*)id(label_connected), "Status: OK");
    - priority: 600.0
      then:
        - lambda: |-
            // Register all sensors with the custom component
            // System parameters
            id(tesla_bms_component).register_sensor("numbmbs", id(numbmbs));
            id(tesla_bms_component).register_sensor("ActualBmbCount", id(actual_bmb_count));
            id(tesla_bms_component).register_sensor("ExpectedBmbCount", id(expected_bmb_count));
            id(tesla_bms_component).register_sensor("BmbConnectedMask", id(bmb_connected_mask));
            id(tesla_bms_component).register_sensor("LoopCnt", id(loopcnt));
            id(tesla_bms_component).register_sensor("LoopState", id(loopstate));
            id(tesla_bms_component).register_sensor("CellsPresent", id(cellspresent));
            id(tesla_bms_component).register_sensor("CellsBalancing", id(cellsbalancing));
            
            // Voltage parameters (with mV to V conversion)
            id(tesla_bms_component).register_voltage_sensor("umax", id(umax));
            id(tesla_bms_component).register_voltage_sensor("umin", id(umin));
            id(tesla_bms_component).register_voltage_sensor("deltaV", id(deltav));
            id(tesla_bms_component).register_voltage_sensor("uavg", id(uavg));
            id(tesla_bms_component).register_voltage_sensor("CellVoltageSum", id(cell_sum_voltage));
            id(tesla_bms_component).register_sensor("CellMax", id(cellmax));
            id(tesla_bms_component).register_sensor("CellMin", id(cellmin));
            id(tesla_bms_component).register_sensor("udc", id(udc));
            
            // Temperature parameters
            id(tesla_bms_component).register_sensor("Chipt0", id(chipt0));
            id(tesla_bms_component).register_sensor("Cellt0_0", id(cellt0_0));
            id(tesla_bms_component).register_sensor("Cellt0_1", id(cellt0_1));
            id(tesla_bms_component).register_sensor("TempMax", id(tempmax));
            id(tesla_bms_component).register_sensor("TempMin", id(tempmin));
            
            // Control parameters
            id(tesla_bms_component).register_sensor("balance", id(balance));
            
            // Chip voltages
            id(tesla_bms_component).register_sensor("ChipV1", id(chipv1));
            id(tesla_bms_component).register_sensor("ChipV2", id(chipv2));
            id(tesla_bms_component).register_sensor("ChipV3", id(chipv3));
            id(tesla_bms_component).register_sensor("ChipV4", id(chipv4));
            
            // Power system
            id(tesla_bms_component).register_sensor("current", id(bms_current));
            id(tesla_bms_component).register_sensor("as8510_temp", id(as8510_temp));
            id(tesla_bms_component).register_sensor("battPos", id(batt_pos));
            id(tesla_bms_component).register_sensor("battNeg", id(batt_neg));
            id(tesla_bms_component).register_sensor("linkPos", id(link_pos));
            id(tesla_bms_component).register_sensor("linkNeg", id(link_neg));
            id(tesla_bms_component).register_sensor("packContactors", id(pack_contactors_status));
            id(tesla_bms_component).register_sensor("cpContactors", id(cp_contactors_status));
            id(tesla_bms_component).register_sensor("PowerWatts", id(bms_power));
            id(tesla_bms_component).register_sensor("EnergyWh", id(bms_energy_wh));
            id(tesla_bms_component).register_sensor("EnergyKWh", id(bms_energy_kwh));
            id(tesla_bms_component).register_sensor("StateOfCharge", id(bms_soc));
            id(tesla_bms_component).register_sensor("RemainingCapacityAh", id(bms_remaining_capacity));
            id(tesla_bms_component).register_sensor("BatteryCapacityAh", id(bms_battery_capacity));
            id(tesla_bms_component).register_sensor("FullyChargedVoltage", id(bms_fully_charged_voltage));
            id(tesla_bms_component).register_sensor("CurrentEfficiency", id(bms_current_efficiency));
            
            // Text sensors
            id(tesla_bms_component).register_text_sensor("BalanceCellList", id(balance_cell_list));
            
            // Individual cell voltages (u001-u108) - All 108 cells
